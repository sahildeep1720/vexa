# docker-compose.azure.yml — overlay adding the Azure transcription adapter +
# standup-extractor to a standard Vexa stack.
#
# Usage (from repo root; --env-file is REQUIRED — compose reads .env from the
# FIRST -f file's dir (deploy/compose), not the repo root, so pass it explicitly):
#   docker compose --env-file .env \
#     -f deploy/compose/docker-compose.yml -f docker-compose.azure.yml up -d --pull=missing
#
# Repointing Vexa at these services is done entirely in .env (see .env.azure.example):
#   TRANSCRIPTION_SERVICE_URL=http://azure-transcriber:8085/v1/audio/transcriptions
#   TRANSCRIPTION_SERVICE_TOKEN=<token azure-transcriber accepts>
#   POST_MEETING_HOOKS=http://standup-extractor:8086/hooks/meeting-completed
#
# meeting-api already reads those three via ${...}, so NO Vexa core compose/service
# edits are required. Keep LOCAL_TRANSCRIPTION unset (we replace it).
services:
  azure-transcriber:
    build:
      # Relative paths in compose resolve against the FIRST -f file's dir
      # (deploy/compose), so ../.. == repo root — same pattern as meeting-api.
      context: ../..
      dockerfile: services/azure-transcriber/Dockerfile
    image: vexa-azure/azure-transcriber:local
    mem_limit: 512m
    ports:
      - "${AZURE_TRANSCRIBER_HOST_PORT:-8085}:8085"
    environment:
      - TRANSCRIBER_MODEL=${TRANSCRIBER_MODEL:-openrouter}
      # OpenRouter (default backend). STT is text-only -> single full-chunk segment.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_TRANSCRIBE_MODEL=${OPENROUTER_TRANSCRIBE_MODEL:-openai/gpt-4o-transcribe}
      - OPENROUTER_REFERER=${OPENROUTER_REFERER:-}
      - OPENROUTER_TITLE=${OPENROUTER_TITLE:-}
      # Azure backends (only if TRANSCRIBER_MODEL is an Azure model)
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2025-04-01-preview}
      # Deployment names (Azure 'model' field = deployment name). Single default + overrides.
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_TRANSCRIBE_DEPLOYMENT:-gpt-4o-transcribe}
      - AZURE_OPENAI_TRANSCRIBE_DEPLOYMENT=${AZURE_OPENAI_TRANSCRIBE_DEPLOYMENT:-}
      - AZURE_OPENAI_TRANSCRIBE_MINI_DEPLOYMENT=${AZURE_OPENAI_TRANSCRIBE_MINI_DEPLOYMENT:-}
      - AZURE_OPENAI_TRANSCRIBE_DIARIZE_DEPLOYMENT=${AZURE_OPENAI_TRANSCRIBE_DIARIZE_DEPLOYMENT:-}
      - AZURE_OPENAI_WHISPER_DEPLOYMENT=${AZURE_OPENAI_WHISPER_DEPLOYMENT:-}
      - AZURE_USE_AAD=${AZURE_USE_AAD:-false}
      # Azure AI Speech (only used when TRANSCRIBER_MODEL=MAI-Transcribe-1)
      - AZURE_SPEECH_ENDPOINT=${AZURE_SPEECH_ENDPOINT:-}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-}
      - AZURE_SPEECH_API_VERSION=${AZURE_SPEECH_API_VERSION:-2025-10-15}
      # Inbound auth: falls back to the same token the bot already carries.
      - INBOUND_AUTH_TOKEN=${INBOUND_AUTH_TOKEN:-}
      - TRANSCRIPTION_SERVICE_TOKEN=${TRANSCRIPTION_SERVICE_TOKEN:-}
      - DEFAULT_LANGUAGE_PROBABILITY=${DEFAULT_LANGUAGE_PROBABILITY:-1.0}
      - REQUEST_TIMEOUT_S=${AZURE_TRANSCRIBER_TIMEOUT_S:-25}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - vexa
    restart: unless-stopped

  standup-extractor:
    build:
      context: ../..
      dockerfile: services/standup-extractor/Dockerfile
    image: vexa-azure/standup-extractor:local
    mem_limit: 512m
    ports:
      - "${STANDUP_EXTRACTOR_HOST_PORT:-8086}:8086"
    environment:
      - MODEL_MODE=${MODEL_MODE:-openrouter}
      # OpenRouter (default). Reuses the same OPENROUTER_API_KEY as the transcriber.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_CHAT_MODEL:-openai/gpt-5.5}
      - OPENROUTER_REQUIRE_PARAMETERS=${OPENROUTER_REQUIRE_PARAMETERS:-true}
      - OPENROUTER_REFERER=${OPENROUTER_REFERER:-}
      - OPENROUTER_TITLE=${OPENROUTER_TITLE:-}
      # Azure (only when MODEL_MODE=azure)
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_CHAT_API_VERSION:-2025-04-01-preview}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-5.5}
      - REASONING_MODEL=${REASONING_MODEL:-true}
      - MAX_COMPLETION_TOKENS=${MAX_COMPLETION_TOKENS:-2000}
      - AZURE_USE_AAD=${AZURE_USE_AAD:-false}
      # OpenAI-compatible proxy (only when MODEL_MODE=openai_compatible)
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      - OPENAI_COMPAT_MODEL=${OPENAI_COMPAT_MODEL:-gpt-5.5}
      # Vexa internal transcript fetch — must match meeting-api's INTERNAL_API_SECRET.
      - MEETING_API_INTERNAL_URL=${MEETING_API_INTERNAL_URL:-http://meeting-api:8080}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-vexa-internal-secret}
      - TEAM_ROSTER=${TEAM_ROSTER:-}
      - KANBAN_API_URL=${KANBAN_API_URL:-}
      - KANBAN_API_KEY=${KANBAN_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - azure-transcriber
    networks:
      - vexa
    restart: unless-stopped

networks:
  vexa:
    driver: bridge
